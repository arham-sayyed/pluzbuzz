<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="pb-services.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&amp;family=Schibsted+Grotesk:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
</helmet>
<a href="{{ s.href }}" style="position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:22px;height:100%;min-height:280px;padding:24px;border-radius:12px;overflow:hidden;background:{{ s.bg }};border:1.5px solid {{ s.border }};text-decoration:none;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;box-sizing:border-box" style-hover="transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(8,11,56,.5)">
  <div aria-hidden="true" style="position:relative;height:120px">
    <sc-if value="{{ m.browser }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;border-radius:8px;border:1.5px solid {{ s.accent }};overflow:hidden;display:flex;flex-direction:column">
        <div style="display:flex;gap:5px;padding:7px 9px;border-bottom:1.5px solid {{ s.accent }}"><span style="width:7px;height:7px;border-radius:50%;background:{{ s.accent }}"></span><span style="width:7px;height:7px;border-radius:50%;background:{{ s.accent }};opacity:.6"></span><span style="width:7px;height:7px;border-radius:50%;background:{{ s.accent }};opacity:.3"></span></div>
        <div style="flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:8px;padding:10px"><span style="border-radius:4px;background:{{ s.accent }}"></span><span style="display:flex;flex-direction:column;gap:6px"><span style="flex:1;border-radius:4px;background:rgba(255,255,255,.14)"></span><span style="flex:1;border-radius:4px;background:rgba(255,255,255,.14)"></span></span></div>
      </div>
    </sc-if>
    <sc-if value="{{ m.search }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;gap:9px">
        <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:999px;border:1.5px solid {{ s.fg }}"><span style="width:10px;height:10px;border-radius:50%;border:2px solid {{ s.fg }}"></span><span style="height:5px;width:55%;border-radius:3px;background:#c9cad6"></span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="padding:3px 7px;border-radius:4px;background:{{ s.accent }};color:#fff;font-family:'IBM Plex Mono';font-size:11px">#1</span><span style="height:6px;width:60%;border-radius:3px;background:{{ s.fg }}"></span></div>
        <div style="display:flex;align-items:center;gap:8px;opacity:.35"><span style="padding:3px 7px;border-radius:4px;border:1px solid {{ s.fg }};font-family:'IBM Plex Mono';font-size:11px">#2</span><span style="height:6px;width:48%;border-radius:3px;background:{{ s.fg }}"></span></div>
        <div style="display:flex;align-items:center;gap:8px;opacity:.2"><span style="padding:3px 7px;border-radius:4px;border:1px solid {{ s.fg }};font-family:'IBM Plex Mono';font-size:11px">#3</span><span style="height:6px;width:40%;border-radius:3px;background:{{ s.fg }}"></span></div>
      </div>
    </sc-if>
    <sc-if value="{{ m.phone }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;top:0;bottom:0;width:72px;border-radius:14px;border:2px solid {{ s.fg }};padding:12px 8px;display:flex;flex-direction:column;gap:6px"><span style="height:6px;width:50%;border-radius:3px;background:{{ s.fg }}"></span><span style="flex:1;border-radius:6px;background:{{ s.accent }}"></span><span style="height:14px;border-radius:4px;background:rgba(255,255,255,.3)"></span></div>
      <div style="position:absolute;left:88px;right:0;top:10px;display:flex;flex-direction:column;gap:8px"><span style="height:28px;border-radius:6px;background:rgba(255,255,255,.18)"></span><span style="height:28px;border-radius:6px;background:rgba(255,255,255,.18)"></span><span style="align-self:flex-start;padding:5px 9px;border-radius:4px;background:{{ s.accent }};color:#080b38;font-family:'IBM Plex Mono';font-size:10.5px">v2.0 shipped</span></div>
    </sc-if>
    <sc-if value="{{ m.bars }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px"><span style="flex:1;height:22%;background:{{ s.accent }};opacity:.35"></span><span style="flex:1;height:38%;background:{{ s.accent }};opacity:.5"></span><span style="flex:1;height:52%;background:{{ s.accent }};opacity:.65"></span><span style="flex:1;height:74%;background:{{ s.accent }};opacity:.8"></span><span style="flex:1;height:100%;background:{{ s.accent }}"></span></div>
    </sc-if>
    <sc-if value="{{ m.nodes }}" hint-placeholder-val="{{ false }}">
      <svg viewBox="0 0 240 120" style="position:absolute;inset:0;width:100%;height:100%"><g stroke="{{ s.accent }}" stroke-width="1.5" opacity=".6"><line x1="30" y1="30" x2="120" y2="60"></line><line x1="30" y1="90" x2="120" y2="60"></line><line x1="120" y1="60" x2="210" y2="25"></line><line x1="120" y1="60" x2="210" y2="95"></line></g><circle cx="30" cy="30" r="7" fill="{{ s.fg }}"></circle><circle cx="30" cy="90" r="7" fill="{{ s.fg }}"></circle><circle cx="120" cy="60" r="14" fill="{{ s.accent }}"></circle><circle cx="210" cy="25" r="7" fill="{{ s.fg }}"></circle><circle cx="210" cy="95" r="7" fill="{{ s.fg }}"></circle></svg>
    </sc-if>
    <sc-if value="{{ m.viewfinder }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0">
        <span style="position:absolute;left:0;top:0;width:22px;height:22px;border-left:2px solid {{ s.fg }};border-top:2px solid {{ s.fg }}"></span><span style="position:absolute;right:0;top:0;width:22px;height:22px;border-right:2px solid {{ s.fg }};border-top:2px solid {{ s.fg }}"></span><span style="position:absolute;left:0;bottom:0;width:22px;height:22px;border-left:2px solid {{ s.fg }};border-bottom:2px solid {{ s.fg }}"></span><span style="position:absolute;right:0;bottom:0;width:22px;height:22px;border-right:2px solid {{ s.fg }};border-bottom:2px solid {{ s.fg }}"></span>
        <span style="position:absolute;left:14px;top:12px;display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono';font-size:11px;color:{{ s.fg }}"><span style="width:8px;height:8px;border-radius:50%;background:{{ s.accent }}"></span>REC</span>
        <span style="position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:1.5px solid {{ s.fg }}"></span>
      </div>
    </sc-if>
    <sc-if value="{{ m.grid }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><span style="border-radius:6px;background:#080b38"></span><span style="border-radius:6px;background:#fff;border:1.5px solid #0a0c24"></span><span style="border-radius:6px;background:#ffc83d"></span><span style="border-radius:6px;background:#555AFE"></span><span style="border-radius:6px;background:#0a0c24"></span><span style="border-radius:6px;background:#141414"></span></div>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;color:{{ s.fg }}">
    <span style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:{{ s.sub }}">{{ kicker }}</span>
    <span style="font-family:'Barlow Condensed';font-weight:800;font-size:clamp(28px,2.4vw,34px);line-height:.95;text-transform:uppercase">{{ s.name }} →</span>
    <span style="font-family:'Schibsted Grotesk',sans-serif;font-size:15px;line-height:1.5;color:{{ s.sub }}">{{ s.blurb }}</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:300},&quot;service&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;web&quot;,&quot;seo&quot;,&quot;growth&quot;,&quot;app&quot;,&quot;ai&quot;,&quot;media&quot;,&quot;all&quot;],&quot;default&quot;:&quot;app&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Related service&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">class Component extends DCLogic {
  componentDidMount() { if (!window.PBServices) this.t = setInterval(() => { if (window.PBServices) { clearInterval(this.t); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const reg = window.PBServices || {}, key = this.props.service ?? 'web';
    const s = reg[key] || reg.web || { name: '', blurb: '', href: '#', bg: '#f4f4f7', fg: '#0a0c24', sub: '#55566a', accent: '#3a5bff', border: '#f4f4f7', motif: 'grid' };
    const m = {}; ['browser', 'search', 'phone', 'bars', 'nodes', 'viewfinder', 'grid'].forEach(k => { m[k] = s.motif === k; });
    return { s: Object.assign({}, s, { href: this.props.href || s.href }), m, kicker: this.props.kicker ?? 'Service' };
  }
}</script>
</body>
</html>
